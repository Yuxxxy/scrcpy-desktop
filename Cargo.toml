[package]
name = "scrcpy-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-platform = { package = "gpui-pre-platform", version = "0.3.9" }
gpui-component = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
